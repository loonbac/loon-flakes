# ==============================================================================
# Configuración de Hyprlock — Bloqueo de pantalla con Blur y colores dinámicos
# ==============================================================================

# Cargar paleta dinámica de colores generada desde el fondo de pantalla
source = ~/.config/hypr/colors.conf

# Fondo del bloqueo: la imagen estática del backdrop (la que está detrás
# del video animado). reload_cmd resuelve el state de niri-backdrop; si no
# hay state, cae al primer wallpaper de ~/Pictures/Wallpaper.
background {
    monitor =
    path = /home/loonbac/Pictures/Wallpaper/Asa-mitaka-yoru-dark.png
    reload_time = 30
    reload_cmd = bash -c 's=~/.config/mpvpaper/backdrop.txt; [ -f "$s" ] && { n=$(cat "$s"); [ -f "$HOME/Pictures/Wallpaper/$n" ] && echo "$HOME/Pictures/Wallpaper/$n"; } || ls "$HOME"/Pictures/Wallpaper/*.{png,jpg,jpeg,webp} 2>/dev/null | head -n1'
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# Entrada de contraseña con colores de la paleta activa
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.25
    dots_center = true
    outer_color = $accent
    inner_color = $surface_alpha
    font_color = $foreground
    fade_on_empty = false
    placeholder_text = <span foreground="##949cbb"><i>Ingresa tu contraseña...</i></span>
    hide_input = false
    check_color = $highlight
    fail_color = $critical
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = $warning
    position = 0, -40
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
}

# Foto de perfil: si existe una imagen llamada "profile" en el home del
# usuario (~/profile.jpeg, ~/profile.png, ...) se muestra circular sobre el reloj.
# reload_cmd busca dinámicamente; si no hay ninguna imagen no se muestra nada.
image {
    monitor =
    path = /home/loonbac/profile.jpeg
    reload_time = 30
    reload_cmd = ls /home/loonbac/profile.* 2>/dev/null | head -n1
    size = 140
    rounding = -1
    border_size = 4
    border_color = $accent
    position = 0, 270
    halign = center
    valign = center
}

# Reloj grande (Hora)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%I:%M %p")"
    color = $foreground
    font_size = 72
    font_family = JetBrainsMono Nerd Font
    position = 0, 90
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
}

# Fecha con color de acento del fondo
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d de %B")"
    color = $accent
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 160
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 2
}
