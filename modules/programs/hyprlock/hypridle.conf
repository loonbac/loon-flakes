# ==============================================================================
# Configuración de Hypridle — Daemon de inactividad para Niri / Wayland
# ==============================================================================

general {
    lock_cmd = pidof hyprlock || hyprlock
    # Bloquear siempre antes de suspender (ej. al bajar la tapa de la laptop)
    before_sleep_cmd = pidof hyprlock || hyprlock
    after_sleep_cmd = niri msg action power-on-monitors
}

# 1. Bloquear la sesión tras 10 minutos (600 s) de inactividad
listener {
    timeout = 600
    on-timeout = pidof hyprlock || hyprlock
}

# 2. Apagar las pantallas tras 15 minutos (900 s) de inactividad
listener {
    timeout = 900
    on-timeout = niri msg action power-off-monitors
    on-resume = niri msg action power-on-monitors
}
