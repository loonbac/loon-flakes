<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Router + Jev · Panel</title>
<style>
  /* La paleta viene del fondo de pantalla, asi que la pagina cambia de color con el
     escritorio en vez de tener un tema propio que lo contradiga. El acento no queda en
     detalles: tiñe el fondo y los marcos, que es lo que hace que el panel se lea como una
     pieza del escritorio y no como una aplicacion aparte. */
  :root {
    --accent: __ACCENT__;
    --background: __BACKGROUND__;
    --surface: __SURFACE__;
    --foreground: __FOREGROUND__;
    --muted: __MUTED__;
    --highlight: __HIGHLIGHT__;
    --warning: __WARNING__;
    --critical: __CRITICAL__;
    --on-accent: __ON_ACCENT__;
    --edge: __EDGE__;
    --board: color-mix(in srgb, var(--background) 82%, #000);
    --card: color-mix(in srgb, var(--background) 92%, #fff 3%);
    --card-edge: color-mix(in srgb, var(--accent) 26%, #000);
  }

  * { box-sizing: border-box; scrollbar-width: none; }
  *::-webkit-scrollbar { width: 0; height: 0; display: none; }

  /* Todo tiene que entrar en una pantalla. El panel se mira de reojo mientras se
     trabaja, y una vista que hay que desplazar deja de servir para eso. */
  html, body { height: 100%; overflow: hidden; }

  body {
    margin: 0;
    background: color-mix(in srgb, var(--accent) 60%, var(--background));
    color: var(--foreground);
    font-family: "JetBrains Mono", "SF Mono", ui-monospace, monospace;
    font-size: 12px; line-height: 1.4;
    -webkit-font-smoothing: antialiased;
  }

  .shell {
    position: relative; z-index: 1;
    height: 100vh; padding: 11px 13px;
    display: grid; gap: 8px;
    grid-template-rows: auto auto minmax(0, 1fr) minmax(0, 1.08fr);
  }

  /* ------------------------------------------------------------------ cabecera */

  .bar {
    display: flex; align-items: center; gap: 13px;
    background: var(--board); border-radius: 9px; padding: 8px 13px;
    border: 1px solid color-mix(in srgb, var(--background) 60%, #000);
  }
  .bar .logo { display: flex; align-items: center; gap: 9px; }
  .bar .logo b { font-size: 14px; letter-spacing: .06em; text-transform: uppercase; }
  .bar .logo b i { font-style: normal; color: var(--accent); }
  .bar .logo span { font-size: 9px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .bar .right { margin-left: auto; display: flex; align-items: baseline; gap: 14px; }
  .bar .clock { font-size: 19px; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
  .bar .date { font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .live {
    display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px;
    font-size: 9px; letter-spacing: .12em; text-transform: uppercase;
    border: 1px solid var(--card-edge); color: var(--muted);
  }
  .live.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .live .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; animation: p 2s infinite; }
  @keyframes p { 0%,100%{opacity:.35} 50%{opacity:1} }

  /* ---------------------------------------------------------------- mini fichas */

  .tiles { display: grid; grid-template-columns: repeat(6, 1fr); gap: 7px; }
  @media (max-width: 1500px) { .tiles { grid-template-columns: repeat(4, 1fr); } .tiles .tile:nth-child(n+9) { display: none; } }

  .tile {
    background: var(--card); border: 1px solid var(--card-edge); border-radius: 7px;
    overflow: hidden; display: flex; flex-direction: column; min-width: 0;
  }
  .tile .cap {
    display: flex; align-items: center; gap: 6px; padding: 4px 8px;
    background: color-mix(in srgb, var(--board) 70%, transparent);
    border-bottom: 1px solid var(--card-edge);
    font-size: 9px; letter-spacing: .11em; text-transform: uppercase; color: var(--muted);
  }
  .tile .cap em { font-style: normal; margin-left: auto; color: var(--accent); font-size: 8.5px;
                 overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tile .cap .ico { width: 4px; height: 4px; border-radius: 1px; background: var(--accent); flex: none; }
  .tile .val { padding: 6px 9px 5px; font-size: 21px; letter-spacing: -.02em;
               font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tile .val small { font-size: 10px; color: var(--muted); margin-left: 3px; }
  .tile .spark { display: block; width: 100%; height: 18px; }
  .tile .foot { margin-top: auto; padding: 3px 9px 5px; font-size: 9px; color: var(--muted);
                overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tile.acc .val { color: var(--accent); }

  /* ------------------------------------------------------------------- paneles */

  .row { display: grid; gap: 8px; min-height: 0; }
  .r-3 { grid-template-columns: 1fr 1fr 1fr; }
  @media (max-width: 1180px) { .r-3 { grid-template-columns: 1fr 1fr; } .r-3 > :nth-child(3) { display: none; } }

  .panel {
    position: relative; background: var(--card); border: 1px solid var(--card-edge);
    border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; min-height: 0;
  }
  /* El borde se ilumina cuando la araña lo pisa. */
  .panel.lit, .tile.lit { border-color: var(--accent); }
  .panel > h2 {
    display: flex; align-items: center; gap: 8px; margin: 0; flex: none;
    padding: 5px 10px; font-size: 9px; font-weight: 500;
    letter-spacing: .13em; text-transform: uppercase; color: var(--muted);
    background: color-mix(in srgb, var(--board) 70%, transparent);
    border-bottom: 1px solid var(--card-edge);
  }
  .panel > h2 .tag { margin-left: auto; font-size: 8.5px; color: var(--accent); letter-spacing: .08em; }
  .panel .body { flex: 1; min-height: 0; overflow: hidden; }
  .panel .body.pad { padding: 8px 10px; }

  /* ------------------------------------------------------------------ tablas */

  .l { display: grid; gap: 8px; align-items: center; padding: 0 10px;
       height: 21px; font-size: 10.5px; }
  .l:hover { background: color-mix(in srgb, var(--accent) 9%, transparent); }
  .l.m { grid-template-columns: 7px minmax(90px,1.6fr) 62px 56px 44px; }
  /* Una sola linea por decision. El alto de fila es fijo para que la lista entre en el
     panel, asi que la fila no puede envolver: el motivo largo va en el title, no en la
     celda, porque una fila de dos lineas se monta sobre la siguiente. */
  /* La primera columna se mide por su contenido mas largo, que es un tiempo relativo.
     Una columna mas angosta que su texto lo deja desbordar sobre la pildora vecina. */
  .l.d { grid-template-columns: 30px minmax(80px,1fr) 44px; }

  .sw { width: 6px; height: 6px; border-radius: 50%; background: var(--card-edge); flex: none; }
  .sw.on { background: var(--accent); box-shadow: 0 0 7px var(--accent); }
  .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nm em { font-style: normal; color: var(--muted); font-size: 9.5px; }
  .nm .u { color: var(--accent); font-size: 9px; }
  .n { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  .n.hi { color: var(--foreground); } .n.acc { color: var(--accent); }

  .pill { display: inline-block; padding: 0 5px; border-radius: 3px; font-size: 8.5px;
          letter-spacing: .05em; text-transform: uppercase;
          border: 1px solid var(--card-edge); color: var(--muted); }
  .pill.a { border-color: var(--accent); color: var(--accent); }
  .pill.hi { border-color: var(--warning); color: var(--warning); }

  /* ------------------------------------------------------------------ balance */

  .bal { display: flex; align-items: baseline; gap: 10px; padding: 7px 10px 0; flex: none; }
  .bal .big { font-size: 27px; letter-spacing: -.02em; color: var(--accent);
              font-variant-numeric: tabular-nums; }
  .bal .lbl { font-size: 9px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

  /* ------------------------------------------------------------- mesa agentes */

  .desk { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 8px; height: 100%; }
  @media (max-width: 1400px) { .desk { grid-template-columns: repeat(3, 1fr); } }
  .ws {
    position: relative; border: 1px solid var(--card-edge); border-radius: 6px; overflow: hidden;
    background: color-mix(in srgb, var(--board) 72%, transparent);
    display: flex; flex-direction: column; min-width: 0;
  }
  .ws.lit { border-color: var(--accent); }
  .ws .top { display: flex; align-items: center; gap: 5px; padding: 3px 6px;
             border-bottom: 1px solid color-mix(in srgb, var(--card-edge) 60%, transparent); flex: none; }
  .ws .top b { font-size: 9px; font-weight: 500; letter-spacing: .05em; text-transform: uppercase;
               color: color-mix(in srgb, var(--foreground) 82%, var(--muted));
               overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ws .top .sw { margin-left: auto; }
  .ws .mid { padding: 4px 6px; font-size: 9px; color: var(--muted); overflow: hidden;
             text-overflow: ellipsis; white-space: nowrap; }
  .ws .mid .m { color: var(--accent); }
  .ws canvas { display: block; width: 100%; height: 16px; flex: none; }
  .ws .bot { display: flex; justify-content: space-between; padding: 2px 6px; font-size: 8.5px;
             color: var(--muted); margin-top: auto; }
  .ws .bot i { font-style: normal; color: var(--accent); font-variant-numeric: tabular-nums; }

  /* ------------------------------------------------------------------ umbrales */

  .code { padding: 6px 0; font-size: 10px; line-height: 1.55; }
  .code .ln { display: flex; gap: 8px; padding: 0 10px; }
  .code .no { color: color-mix(in srgb, var(--muted) 55%, transparent); min-width: 18px;
              text-align: right; user-select: none; flex: none; }
  .code .tx { white-space: pre; overflow: hidden; text-overflow: ellipsis; }
  .code .cm { color: color-mix(in srgb, var(--muted) 88%, transparent); font-style: italic; }
  .code .kw { color: var(--highlight); }
  .code .nm2 { color: var(--foreground); }
  .code .vl { color: var(--accent); }

  /* --------------------------------------------------------------------- cuota */

  .prov { padding: 6px 10px; }
  .prov + .prov { border-top: 1px solid color-mix(in srgb, var(--card-edge) 60%, transparent); }
  .prov .hd { display: flex; align-items: baseline; gap: 7px; margin-bottom: 3px; }
  .prov .hd b { font-size: 10.5px; font-weight: 500; color: var(--accent); }
  .prov .hd em { margin-left: auto; font-style: normal; font-size: 9px; color: var(--muted); }
  .w { margin-bottom: 3px; }
  .w .t { display: flex; justify-content: space-between; font-size: 9px; margin-bottom: 1px; }
  .w .t span:first-child { color: var(--muted); overflow: hidden; text-overflow: ellipsis;
                           white-space: nowrap; max-width: 62%; }
  .w .t span:last-child { font-variant-numeric: tabular-nums; flex: none; }
  .tr { height: 3px; border-radius: 2px; background: color-mix(in srgb, var(--card-edge) 70%, transparent); overflow: hidden; }
  .tr i { display: block; height: 100%; }
  .lv-low { background: var(--critical); } .lv-mid { background: var(--warning); } .lv-ok { background: var(--accent); }

  .empty { padding: 12px 10px; color: var(--muted); font-size: 10px; text-align: center; }
  .kv { display: flex; justify-content: space-between; padding: 3px 10px; font-size: 10px; }
  .kv span:first-child { color: var(--muted); }
  .kv span:last-child { font-variant-numeric: tabular-nums; overflow: hidden;
                        text-overflow: ellipsis; white-space: nowrap; max-width: 60%; }

  /* ------------------------------------------------- la telaraña, sobre todo ==

     Una sola capa fija por encima del panel. La araña no vive dentro de un recuadro:
     recorre la página entera, apoyándose en las tarjetas reales, porque es el router
     el que se mueve por todo el trabajo y no por una sección suya. */
  #web {
    position: fixed; inset: 0; width: 100vw; height: 100vh;
    pointer-events: none; z-index: 40;
  }
</style>
</head>
<body>

<canvas id="web"></canvas>

<div class="shell">

  <div class="bar">
    <div class="logo">
      <svg width="19" height="19" viewBox="0 0 20 20" aria-hidden="true">
        <g fill="none" stroke="var(--accent)" stroke-width="1.1" stroke-linecap="round">
          <path d="M10 10 L4 4 M10 10 L16 4 M10 10 L3 10 M10 10 L17 10 M10 10 L4 16 M10 10 L16 16"/>
        </g>
        <ellipse cx="10" cy="11.4" rx="2.5" ry="1.9" fill="var(--accent)"/>
        <circle cx="10" cy="8.4" r="1.5" fill="var(--foreground)"/>
      </svg>
      <b>Router <i>+</i> Jev</b><span>el router elige · Pi ejecuta</span>
    </div>
    <div class="live" id="live"><span class="dot"></span><span id="liveText"></span></div>
    <div class="right">
      <span class="date" id="date"></span>
      <span class="clock" id="clock">--:--:--</span>
      <span class="date">local</span>
    </div>
  </div>

  <div class="tiles" id="tiles"></div>

  <div class="row r-3">
    <div class="panel" data-web>
      <h2>Orquestación<span class="tag" id="orchTag"></span></h2>
      <div class="body pad" id="orch"></div>
    </div>
    <div class="panel" data-web>
      <h2>Consumo diario<span class="tag">30 días</span></h2>
      <div class="bal"><span class="big" id="balTotal"></span><span class="lbl" id="balSub"></span></div>
      <div class="body pad" style="padding-top:2px" id="daily"></div>
    </div>
    <div class="panel" data-web>
      <h2>Cuota<span class="tag" id="quotaTag"></span></h2>
      <div class="body" id="quota"></div>
    </div>
  </div>

  <div class="row r-3">
    <div class="panel" data-web>
      <h2>Mesa de agentes<span class="tag" id="deskTag"></span></h2>
      <div class="desk" id="desk"></div>
    </div>
    <div class="panel" data-web>
      <h2>Modelos<span class="tag" id="modelsTag"></span></h2>
      <div class="body" id="models"></div>
    </div>
    <div class="panel" data-web>
      <h2>Decisiones<span class="tag" id="decTag"></span></h2>
      <div class="body" id="decisions"></div>
    </div>
  </div>

</div>

<script id="payload" type="application/json">__PAYLOAD__</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById("payload").textContent);
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pctTxt = (v) => v === null || v === undefined ? "—" : Math.round(v * 100) + "%";
const lvl = (v) => v === null || v === undefined ? "ok" : v < 0.2 ? "low" : v < 0.5 ? "mid" : "ok";

/* ------------------------------------------------------------------- reloj */

function tick() {
  const now = new Date();
  $("clock").textContent = now.toLocaleTimeString("es-PE", { hour12: false });
  $("date").textContent = now.toLocaleDateString("es-PE", { day: "2-digit", month: "short", year: "numeric" }).toUpperCase();
}
tick(); setInterval(tick, 1000);
$("live").classList.toggle("on", DATA.live);
$("liveText").textContent = DATA.live ? "enrutando" : "en reposo";

/* ------------------------------------------------------------------- fichas */

const adaptiveShare = Math.round(DATA.counts.adaptive / Math.max(1, DATA.counts.adaptive + DATA.counts.static) * 100);
const tiles = [
  ["tokens", "total", DATA.totals.tokensText, DATA.totals.calls + " llamadas"],
  ["costo", "acumulado", "$" + DATA.totals.costText, "mes $" + DATA.totals.monthCostText],
  ["hoy", "consumo", DATA.totals.todayTokensText, "$" + DATA.totals.todayCostText, true],
  ["mes", "en curso", DATA.totals.monthTokensText, "$" + DATA.totals.monthCostText],
  ["modelos", "activos", DATA.counts.active, DATA.counts.free + " gratis / " + DATA.counts.catalog + " catálogo"],
  ["agentes", "perfiles", DATA.agents.length, DATA.agents.filter(a => a.decisions > 0).length + " con trabajo"],
  ["decisiones", "registradas", DATA.counts.receipts, adaptiveShare + "% adaptativas", true],
  ["evidencia", "admitida", DATA.counts.observations, "corridas verificadas"],
  ["adaptativas", "vs estáticas", DATA.counts.adaptive, DATA.counts.static + " estáticas", true],
  ["cuota", "más ajustada", DATA.quotas.length ? pctTxt(Math.min(...DATA.quotas.map(q => q.tightest ?? 1))) : "—", "ventana dura"],
  ["exploración", "del router", DATA.control.exploration ? "activa" : "inactiva", DATA.control.mode || "—"],
  ["acento", "del escritorio", DATA.accent, "derivado del fondo"],
];

$("tiles").innerHTML = tiles.map(([k, sub, value, foot, acc]) => `
  <div class="tile${acc ? " acc" : ""}" data-web>
    <div class="cap"><span class="ico"></span>${esc(k)}<em>${esc(sub)}</em></div>
    <div class="val">${esc(value)}</div>
    <canvas class="spark"></canvas>
    <div class="foot">${esc(foot)}</div>
  </div>`).join("");

const dailyTokens = DATA.daily.map(d => d.tokens);
document.querySelectorAll(".tile .spark").forEach((canvas, index) => {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = canvas.clientWidth || 140, h = 18;
  canvas.width = w * dpr; canvas.height = h * dpr;
  const c = canvas.getContext("2d"); c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const recent = dailyTokens.slice(-16);
  const max = Math.max(1, ...recent);
  c.beginPath();
  recent.forEach((v, i) => {
    const x = recent.length < 2 ? w / 2 : i / (recent.length - 1) * w;
    const y = h - 1.5 - (v / max) * (h - 4);
    i ? c.lineTo(x, y) : c.moveTo(x, y);
  });
  c.strokeStyle = getComputedStyle(document.documentElement)
    .getPropertyValue(index % 3 === 0 ? "--accent" : index % 3 === 1 ? "--highlight" : "--warning").trim();
  c.lineWidth = 1.2; c.stroke();
});

/* -------------------------------------------------------------- orquestacion */

const lastAdaptive = DATA.decisions.find(d => d.kind === "ADAPTIVE_ASSIGNMENT");
$("orchTag").textContent = DATA.live ? "en vivo" : "en reposo";
$("orch").innerHTML = [
  ["Última ruta adaptativa", lastAdaptive ? (lastAdaptive.model || "—") : "—"],
  ["Hace", lastAdaptive ? lastAdaptive.ago : "—"],
  ["Clase de tarea", lastAdaptive ? (lastAdaptive.taskClass || "—") : "—"],
  ["Agente", lastAdaptive ? (lastAdaptive.role || "—") : "—"],
  ["Latencia de decisión", lastAdaptive && lastAdaptive.latency ? Math.round(lastAdaptive.latency) + " ms" : "—"],
  ["Modo", DATA.control.mode || "—"],
  ["Exploración", DATA.control.exploration ? "activa" : "inactiva"],
  ["Modelos elegibles", DATA.counts.active + " de " + DATA.counts.catalog],
].map(([k, v]) => `<div class="kv"><span>${esc(k)}</span><span>${esc(v)}</span></div>`).join("") +
  /* Las rutas adaptativas que siguieron, para que el panel muestre la secuencia y no
     solo el ultimo punto: es la traza de lo que el router viene eligiendo. */
  `<div class="kv" style="border-top:1px solid var(--card-edge);margin-top:4px;padding-top:5px">
     <span>Rutas adaptativas recientes</span><span></span></div>` +
  DATA.decisions.filter(d => d.kind === "ADAPTIVE_ASSIGNMENT").slice(0, 5)
    .map(d => `<div class="kv"><span>${esc(d.ago)} · ${esc((d.role || "").replace(/^gentle-ai-/, ""))}</span>
      <span class="u" style="color:var(--accent)">${esc((d.model || "—").split("/").pop())}</span></div>`).join("");

/* ------------------------------------------------------------------- balance */

const peak = Math.max(1, ...dailyTokens);
$("balTotal").textContent = "$" + DATA.totals.costText;
$("balSub").textContent = DATA.totals.tokensText + " tokens · " + DATA.daily.length + " días";
$("daily").innerHTML = DATA.daily.length ? `
  <svg viewBox="0 0 300 70" preserveAspectRatio="none" style="width:100%;height:calc(100% - 14px);display:block">
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--accent)" stop-opacity=".42"/>
      <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="M0,70 ${DATA.daily.map((d, i) =>
      `L${(i / Math.max(1, DATA.daily.length - 1) * 300).toFixed(1)},${(70 - d.tokens / peak * 64).toFixed(1)}`).join(" ")} L300,70 Z" fill="url(#g)"/>
    <path d="M${DATA.daily.map((d, i) =>
      `${(i / Math.max(1, DATA.daily.length - 1) * 300).toFixed(1)},${(70 - d.tokens / peak * 64).toFixed(1)}`).join(" L")}"
      fill="none" stroke="var(--accent)" stroke-width="1.4"/>
  </svg>
  <div style="display:flex;font-size:8.5px;color:var(--muted)">
    <span>${esc(DATA.daily[0].day)}</span><span style="margin-left:auto">${esc(DATA.daily[DATA.daily.length - 1].day)}</span>
  </div>` : `<div class="empty">Sin datos diarios.</div>`;

/* --------------------------------------------------------------- mesa agentes */

const shownAgents = DATA.agents.slice(0, 12);
$("deskTag").textContent = shownAgents.length + " de " + DATA.agents.length;
$("desk").innerHTML = shownAgents.length === 0 ? `<div class="empty">Sin agentes.</div>`
  : shownAgents.map((a) => `
    <div class="ws" data-web>
      <div class="top"><b>${esc(a.name.replace(/^gentle-ai-|^jd-|^sdd-/, ""))}</b>
        <span class="sw${a.decisions > 0 ? " on" : ""}"></span></div>
      <div class="mid">${a.actuallyUsed.length ? `<span class="m">${esc(a.actuallyUsed[0].model.split("/").pop().slice(0, 18))}</span> · ` : ""}${esc((a.assigned || "").split("/").pop().split(" · ")[0].slice(0, 16))}</div>
      <canvas class="wspark"></canvas>
      <div class="bot"><span>${a.decisions} dec</span><i>${a.adaptive} adapt</i></div>
    </div>`).join("");

document.querySelectorAll(".wspark").forEach((canvas) => {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = canvas.clientWidth || 120, h = 16;
  canvas.width = w * dpr; canvas.height = h * dpr;
  const c = canvas.getContext("2d"); c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const values = dailyTokens.slice(-12), max = Math.max(1, ...values);
  c.beginPath();
  values.forEach((v, i) => {
    const x = values.length < 2 ? w / 2 : i / (values.length - 1) * w;
    const y = h - 1 - (v / max) * (h - 3);
    i ? c.lineTo(x, y) : c.moveTo(x, y);
  });
  c.strokeStyle = "color-mix(in srgb, var(--accent) 45%, transparent)";
  c.lineWidth = 1; c.stroke();
});

/* -------------------------------------------------------------------- modelos */

const shownModels = DATA.models.slice(0, 11);
$("modelsTag").textContent = shownModels.length + " de " + DATA.models.length;
$("models").innerHTML = shownModels.length === 0 ? `<div class="empty">Sin consumo registrado.</div>`
  : shownModels.map(m => `
    <div class="l m" data-web>
      <span class="sw${m.live ? " on" : ""}"></span>
      <span class="nm">${esc(m.name)}<em> · ${esc(m.provider)}</em></span>
      <span class="n hi">${esc(m.tokensText)}</span>
      <span class="n${m.cost === 0 ? "" : " acc"}">$${esc(m.costText)}</span>
      <span class="n">${m.calls}</span>
    </div>`).join("");

/* --------------------------------------------------------------------- cuota */

$("quotaTag").textContent = DATA.quotas.length + " proveedores";
$("quota").innerHTML = DATA.quotas.length === 0 ? `<div class="empty">Sin datos de cuota.</div>`
  : DATA.quotas.map(q => {
    const hard = q.windows.filter(w => w.hard).slice(0, 2);
    return `<div class="prov">
      <div class="hd"><b>${esc(q.alias)}</b>
        <em>${esc(q.health || "")}${q.tightest !== null && q.tightest !== undefined ? " · " + pctTxt(q.tightest) : ""}</em></div>
      ${hard.length ? hard.map(w => `
        <div class="w">
          <div class="t"><span>${esc((w.label || w.id || "").replace(/ Remaining$/, ""))}</span>
            <span>${pctTxt(w.remaining)}</span></div>
          <div class="tr"><i class="${lvl(w.remaining)}" style="width:${Math.max(1.5, (w.remaining ?? 0) * 100)}%"></i></div>
        </div>`).join("") : `<div class="w"><div class="t"><span>sin ventanas declaradas</span></div></div>`}
    </div>`;
  }).join("");

/* ---------------------------------------------------------------- decisiones */

const chip = (d) => d.kind === "ADAPTIVE_ASSIGNMENT" ? "a" : (d.risk === "HIGH" || d.risk === "CRITICAL") ? "hi" : "";
$("decTag").textContent = DATA.decisions.length + " últimas";
$("decisions").innerHTML = DATA.decisions.length === 0 ? `<div class="empty">Sin decisiones.</div>`
  : DATA.decisions.slice(0, 12).map(d => `
    <div class="l d" data-web title="${esc(d.reason || "")}">
      <span class="n">${esc(d.ago.replace("hace ", ""))}</span>
      <span class="nm"><span class="pill ${chip(d)}">${d.kind === "ADAPTIVE_ASSIGNMENT" ? "adapt" : "estát"}</span>
        ${esc((d.role || "").replace(/^gentle-ai-/, ""))}
        ${d.model ? `<span class="u"> ${esc(d.model.split("/").pop())}</span>` : ""}</span>
      <span class="n">${d.latency ? Math.round(d.latency) + "ms" : ""}</span>
    </div>`).join("");

/* =============================================== la telaraña sobre toda la página ==

   Una sola capa fija por encima del panel. Los puntos donde se apoya la araña no se
   inventan: se leen del DOM, así que son las tarjetas y las filas reales. Eso es lo
   que hace que la araña recorra la página entera —los paneles, la mesa de agentes y
   cada fila— en vez de pasearse dentro de un recuadro suyo.

   El dibujo es deliberadamente tenue: tiene que leerse como algo que está por encima
   del panel sin competir con los números, que es lo que el panel existe para mostrar. */

const canvas = $("web"), ctx = canvas.getContext("2d");
const still = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let targets = [], route = [], routeIndex = 0, spider = { x: 0, y: 0 }, gait = 0, litNode = null;

const colorOf = (name, fallback) =>
  getComputedStyle(document.documentElement).getPropertyValue(name).trim() || fallback;

function collect() {
  /* Cada elemento con `data-web` aporta un punto de apoyo, tomado de su caja real. Se
     usa el borde y no el centro para que la araña camine por los marcos, que es donde
     el paso se ve, en vez de cruzar por encima de los números. */
  const nodes = [];
  document.querySelectorAll("[data-web]").forEach((el) => {
    const r = el.getBoundingClientRect();
    if (r.width < 24 || r.height < 12) return;
    const corners = [
      { x: r.left, y: r.top }, { x: r.right, y: r.top },
      { x: r.right, y: r.bottom }, { x: r.left, y: r.bottom },
    ];
    nodes.push({ x: r.left + r.width / 2, y: r.top, el, box: r });
    nodes.push({ x: r.left + r.width / 2, y: r.bottom, el, box: r });
    nodes.push({ x: r.left, y: r.top + r.height / 2, el, box: r });
    nodes.push({ x: r.right, y: r.top + r.height / 2, el, box: r });
    void corners;
  });
  targets = nodes;
}

function size() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  collect();
  plan();
}

/* La araña va al punto más cercano que le queda, no al siguiente de una lista: así el
   paso es continuo y no cruza la pantalla de un salto. */
function plan() {
  route = [];
  if (!targets.length) return;
  const left = new Set(targets.map((_, i) => i));
  let at = 0;
  while (left.size && route.length < 70) {
    route.push(at); left.delete(at);
    let best = null, bestD = Infinity;
    for (const i of left) {
      const d = (targets[i].x - targets[at].x) ** 2 + (targets[i].y - targets[at].y) ** 2;
      if (d < bestD) { bestD = d; best = i; }
    }
    if (best === null) break;
    at = best;
  }
  routeIndex = 0;
  if (targets[route[0]]) spider = { x: targets[route[0]].x, y: targets[route[0]].y };
}

function drawSpider(x, y, scale, heading, t, color, ink) {
  const L = 22 * scale;
  ctx.save(); ctx.translate(x, y); ctx.rotate(heading);
  for (let side = -1; side <= 1; side += 2) {
    for (let i = 0; i < 4; i++) {
      const off = i * .42, phase = (side > 0 ? 0 : Math.PI) + off + gait;
      const swing = Math.sin(t * 3.4 + phase) * (-.85 + i * .42) * .5;
      const len = L * (1 - Math.abs(i - 1.5) * .09);
      const mx = Math.cos(swing) * len * .58, my = Math.sin(swing) * len * .58 - len * .3;
      const ex = Math.cos(swing * 1.5) * len, ey = Math.sin(swing * 1.5) * len - len * .12;
      ctx.beginPath(); ctx.moveTo(0, 0);
      ctx.lineTo(mx, side * Math.abs(my) - 2 * side);
      ctx.lineTo(ex, side * Math.abs(ey));
      ctx.strokeStyle = ink; ctx.lineWidth = 1.3 * scale; ctx.lineCap = "round"; ctx.stroke();
    }
  }
  const beat = .5 + Math.sin(t * 2.6) * .5;
  ctx.beginPath(); ctx.ellipse(-6.5 * scale, 0, 8.5 * scale, 6 * scale, 0, 0, Math.PI * 2);
  ctx.fillStyle = color; ctx.globalAlpha = .9; ctx.fill(); ctx.globalAlpha = 1;
  ctx.beginPath(); ctx.ellipse(3.2 * scale, 0, 4.8 * scale, 4 * scale, 0, 0, Math.PI * 2);
  ctx.fillStyle = ink; ctx.fill();
  ctx.beginPath(); ctx.arc(-6.5 * scale, 0, 11 * scale * (.55 + beat * .16), 0, Math.PI * 2);
  ctx.strokeStyle = color; ctx.globalAlpha = .15 + beat * .1; ctx.lineWidth = 1; ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.restore();
}

let sincePlan = 0;
function frame(ms) {
  const t = ms / 1000;
  const color = colorOf("--accent", "#7aa2f7");
  const ink = colorOf("--foreground", "#fff");

  ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

  // Los hilos permanentes: una tela tenue entre puntos cercanos, para que la página
  // se lea como una red y no como puntos sueltos.
  ctx.lineWidth = 1;
  for (let i = 0; i < targets.length; i++) {
    for (let j = i + 1; j < targets.length; j++) {
      const a = targets[i], b = targets[j];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      if (d > 130) continue;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
      ctx.strokeStyle = color; ctx.globalAlpha = (1 - d / 130) * .07; ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;

  // El cordel que va dejando la araña: el recorrido ya hecho.
  if (route.length > 1) {
    ctx.beginPath();
    route.forEach((i, k) => {
      const p = targets[i]; if (!p) return;
      k ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y);
    });
    ctx.strokeStyle = color; ctx.globalAlpha = .13;
    ctx.setLineDash([4, 8]); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
  }

  for (const node of targets) {
    const beat = .5 + Math.sin(t * 1.4 + node.x * .01) * .5;
    ctx.beginPath(); ctx.arc(node.x, node.y, 1.5 + beat * .7, 0, Math.PI * 2);
    ctx.fillStyle = color; ctx.globalAlpha = .3 + beat * .2; ctx.fill();
  }
  ctx.globalAlpha = 1;

  if (route.length > 1) {
    const to = targets[route[(routeIndex + 1) % route.length]];
    if (!to) { plan(); requestAnimationFrame(frame); return; }
    const speed = still ? 0 : .016;
    spider.x += (to.x - spider.x) * speed;
    spider.y += (to.y - spider.y) * speed;
    if (Math.hypot(to.x - spider.x, to.y - spider.y) < 5) {
      routeIndex = (routeIndex + 1) % route.length;
      if (litNode && litNode.el) litNode.el.classList.remove("lit");
      litNode = targets[route[routeIndex]];
      if (litNode && litNode.el) litNode.el.classList.add("lit");
    }
    gait += still ? 0 : .05;
    drawSpider(spider.x, spider.y, 1, Math.atan2(to.y - spider.y, to.x - spider.x), t, color, ink);
  }

  /* El DOM cambia de tamaño cuando cargan las chispas, así que el recorrido se vuelve
     a calcular cada tanto en vez de quedar fijado al primer pintado. */
  sincePlan++;
  if (sincePlan > 400) { sincePlan = 0; collect(); if (!route.length) plan(); }
  requestAnimationFrame(frame);
}

size();
window.addEventListener("resize", size);
requestAnimationFrame(frame);

/* La página se recarga sola para seguir al generador, que reescribe este archivo cada
   30 s. No necesita servidor ni conexión. */
if (!still) setTimeout(() => window.location.reload(), 30000);
</script>
</body>
</html>
