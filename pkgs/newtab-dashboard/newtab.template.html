<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Router + Jev · Panel</title>
<style>
  /* La paleta entera viene del fondo de pantalla, asi que la pagina cambia de color con
     el escritorio. El acento no se usa solo en detalles: tiñe el fondo y los marcos, que es
     lo que hace que el panel se lea como una pieza del escritorio y no como una app aparte. */
  :root {
    --accent: __ACCENT__;
    --background: __BACKGROUND__;
    --surface: __SURFACE__;
    --foreground: __FOREGROUND__;
    --muted: __MUTED__;
    --highlight: __HIGHLIGHT__;
    --warning: __WARNING__;
    --critical: __CRITICAL__;
    --on-accent: __ON_ACCENT__;
    --edge: __EDGE__;

    /* El tablero oscuro sobre el que se apoyan las tarjetas. */
    --board: color-mix(in srgb, var(--background) 82%, #000);
    --card: color-mix(in srgb, var(--background) 92%, #fff 3%);
    --card-edge: color-mix(in srgb, var(--accent) 26%, #000);
    --line: color-mix(in srgb, var(--accent) 16%, transparent);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; min-height: 100%;
    background: color-mix(in srgb, var(--accent) 62%, var(--background));
    color: var(--foreground);
    font-family: "JetBrains Mono", "SF Mono", ui-monospace, monospace;
    font-size: 12px; line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }

  .shell { max-width: 1780px; margin: 0 auto; padding: 12px 14px 20px; }

  /* ------------------------------------------------------------------ cabecera */

  .bar {
    display: flex; align-items: center; gap: 14px;
    background: var(--board); border-radius: 10px; padding: 9px 14px;
    border: 1px solid color-mix(in srgb, var(--background) 60%, #000);
    margin-bottom: 10px;
  }
  .bar .logo { display: flex; align-items: center; gap: 9px; }
  .bar .logo b {
    font-size: 15px; letter-spacing: .06em; text-transform: uppercase; color: var(--foreground);
  }
  .bar .logo b i { font-style: normal; color: var(--accent); }
  .bar .logo span { font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .bar .right { margin-left: auto; display: flex; align-items: baseline; gap: 16px; }
  .bar .right .clock {
    font-size: 20px; font-variant-numeric: tabular-nums; color: var(--foreground); letter-spacing: .02em;
  }
  .bar .right .date { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .live {
    display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px;
    font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase;
    border: 1px solid var(--card-edge); color: var(--muted);
  }
  .live.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .live .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; animation: p 2s infinite; }
  @keyframes p { 0%,100%{opacity:.35} 50%{opacity:1} }

  /* ---------------------------------------------------------------- mini fichas */

  .tiles { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-bottom: 8px; }
  @media (max-width: 1400px) { .tiles { grid-template-columns: repeat(4, 1fr); } }
  @media (max-width: 900px)  { .tiles { grid-template-columns: repeat(2, 1fr); } }

  .tile {
    background: var(--card); border: 1px solid var(--card-edge); border-radius: 8px;
    overflow: hidden; display: flex; flex-direction: column;
  }
  .tile .cap {
    display: flex; align-items: center; gap: 7px; padding: 5px 9px;
    background: color-mix(in srgb, var(--board) 70%, transparent);
    border-bottom: 1px solid var(--card-edge);
    font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
  }
  .tile .cap em { font-style: normal; margin-left: auto; color: var(--accent); font-size: 9px; }
  .tile .cap .ico { width: 5px; height: 5px; border-radius: 1px; background: var(--accent); }
  .tile .val {
    padding: 8px 10px 9px; font-size: 23px; letter-spacing: -.02em;
    font-variant-numeric: tabular-nums; color: var(--foreground);
  }
  .tile .val small { font-size: 11px; color: var(--muted); margin-left: 3px; }
  .tile .foot {
    margin-top: auto; padding: 4px 10px; font-size: 9.5px; color: var(--muted);
    border-top: 1px solid color-mix(in srgb, var(--card-edge) 55%, transparent);
  }
  .tile .spark { height: 22px; display: block; width: 100%; }
  .tile.acc .val { color: var(--accent); }

  /* ------------------------------------------------------------------- paneles */

  .row { display: grid; gap: 8px; margin-bottom: 8px; }
  .r-hero { grid-template-columns: 1.55fr 1fr; }
  .r-3 { grid-template-columns: repeat(3, 1fr); }
  .r-4 { grid-template-columns: 1.1fr 1fr 1fr; }
  @media (max-width: 1180px) { .r-hero, .r-3, .r-4 { grid-template-columns: 1fr; } }

  .panel {
    background: var(--card); border: 1px solid var(--card-edge); border-radius: 8px;
    overflow: hidden; display: flex; flex-direction: column; min-width: 0;
  }
  .panel > h2 {
    display: flex; align-items: center; gap: 9px; margin: 0;
    padding: 6px 11px; font-size: 9.5px; font-weight: 500;
    letter-spacing: .13em; text-transform: uppercase; color: var(--muted);
    background: color-mix(in srgb, var(--board) 70%, transparent);
    border-bottom: 1px solid var(--card-edge);
  }
  .panel > h2 .tag { margin-left: auto; font-size: 9px; color: var(--accent); letter-spacing: .08em; }
  .panel .body { padding: 0; overflow: auto; flex: 1; }
  .panel .body.pad { padding: 10px 11px; }

  /* ------------------------------------------------------------------ tablas */

  .h { display: grid; gap: 9px; padding: 4px 11px; font-size: 9px; letter-spacing: .1em;
       text-transform: uppercase; color: var(--muted);
       border-bottom: 1px solid var(--card-edge); position: sticky; top: 0;
       background: var(--card); z-index: 1; }
  .h, .l { grid-template-columns: 8px minmax(120px,1.6fr) 74px 68px 54px 60px; }
  .l { display: grid; gap: 9px; align-items: center; padding: 5px 11px; font-size: 11px;
       border-bottom: 1px solid color-mix(in srgb, var(--card-edge) 40%, transparent); }
  .l:last-child { border-bottom: 0; }
  .l:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }

  .h.a, .l.a { grid-template-columns: 8px minmax(110px,1.5fr) 82px 46px; }
  .h.d, .l.d { grid-template-columns: 54px minmax(120px,1fr) 62px; }

  .sw { width: 6px; height: 6px; border-radius: 50%; background: var(--card-edge); }
  .sw.on { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nm em { font-style: normal; color: var(--muted); font-size: 10px; }
  .nm .u { color: var(--accent); font-size: 9.5px; }
  .n { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  .n.hi { color: var(--foreground); } .n.acc { color: var(--accent); }

  .pill {
    display: inline-block; padding: 0 6px; border-radius: 4px; font-size: 9px;
    letter-spacing: .06em; text-transform: uppercase;
    border: 1px solid var(--card-edge); color: var(--muted);
  }
  .pill.a { border-color: var(--accent); color: var(--accent); }
  .pill.hi { border-color: var(--warning); color: var(--warning); }
  .pill.cr { border-color: var(--critical); color: var(--critical); }

  /* -------------------------------------------------------------- orquestacion */

  .stage { position: relative; height: 300px; background:
      radial-gradient(520px 260px at 50% 48%, color-mix(in srgb, var(--accent) 12%, transparent), transparent 72%),
      color-mix(in srgb, var(--board) 88%, #000); }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .stage .cap2 {
    position: absolute; left: 12px; bottom: 10px; font-size: 9.5px;
    letter-spacing: .1em; text-transform: uppercase; color: var(--muted); z-index: 2;
  }
  .stage .cap2 b { color: var(--accent); font-weight: 500; }

  /* ------------------------------------------------------------------ balance */

  .balance { display: flex; align-items: baseline; gap: 12px; padding: 9px 11px 2px; }
  .balance .big { font-size: 30px; letter-spacing: -.02em; color: var(--accent); font-variant-numeric: tabular-nums; }
  .balance .lbl { font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

  /* ------------------------------------------------------------- mesa agentes */

  .desk { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 7px; padding: 9px; }
  .ws {
    border: 1px solid var(--card-edge); border-radius: 6px; overflow: hidden;
    background: color-mix(in srgb, var(--board) 72%, transparent);
  }
  .ws .top { display: flex; align-items: center; gap: 6px; padding: 4px 7px;
             border-bottom: 1px solid color-mix(in srgb, var(--card-edge) 60%, transparent); }
  .ws .top b { font-size: 9.5px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase;
               color: color-mix(in srgb, var(--foreground) 80%, var(--muted)); overflow: hidden;
               text-overflow: ellipsis; white-space: nowrap; }
  .ws .top .sw { margin-left: auto; }
  .ws .mid { padding: 6px 7px; font-size: 9.5px; color: var(--muted); min-height: 30px; }
  .ws .mid .m { color: var(--accent); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ws canvas { display: block; width: 100%; height: 20px; }
  .ws .bot { display: flex; justify-content: space-between; padding: 3px 7px; font-size: 9px;
             color: var(--muted); border-top: 1px solid color-mix(in srgb, var(--card-edge) 60%, transparent); }
  .ws .bot i { font-style: normal; color: var(--accent); font-variant-numeric: tabular-nums; }

  /* ------------------------------------------------------------------ umbrales */

  .code { padding: 8px 0; font-size: 10.5px; line-height: 1.65; }
  .code .ln { display: flex; gap: 10px; padding: 0 11px; }
  .code .ln:hover { background: color-mix(in srgb, var(--accent) 7%, transparent); }
  .code .no { color: color-mix(in srgb, var(--muted) 60%, transparent); min-width: 22px; text-align: right;
              user-select: none; }
  .code .tx { white-space: pre; overflow: hidden; text-overflow: ellipsis; }
  .code .cm { color: color-mix(in srgb, var(--muted) 85%, transparent); font-style: italic; }
  .code .kw { color: var(--highlight); }
  .code .nm2 { color: var(--foreground); }
  .code .vl { color: var(--accent); }

  /* --------------------------------------------------------------------- cuota */

  .prov { padding: 8px 11px; } .prov + .prov { border-top: 1px solid var(--card-edge); }
  .prov .hd { display: flex; align-items: baseline; gap: 8px; margin-bottom: 5px; }
  .prov .hd b { font-size: 11px; font-weight: 500; color: var(--accent); }
  .prov .hd em { margin-left: auto; font-style: normal; font-size: 9.5px; color: var(--muted); }
  .w { margin-bottom: 4px; }
  .w .t { display: flex; justify-content: space-between; font-size: 9.5px; margin-bottom: 2px; }
  .w .t span:first-child { color: var(--muted); } .w .t span:last-child { font-variant-numeric: tabular-nums; }
  .tr { height: 3px; border-radius: 2px; background: color-mix(in srgb, var(--card-edge) 70%, transparent); overflow: hidden; }
  .tr i { display: block; height: 100%; }
  .lv-low { background: var(--critical); } .lv-mid { background: var(--warning); } .lv-ok { background: var(--accent); }

  .empty { padding: 14px 11px; color: var(--muted); font-size: 10.5px; text-align: center; }
  .kv { display: flex; justify-content: space-between; padding: 4px 11px; font-size: 10.5px; }
  .kv span:first-child { color: var(--muted); } .kv span:last-child { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="shell">

  <div class="bar">
    <div class="logo">
      <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
        <g fill="none" stroke="var(--accent)" stroke-width="1.1" stroke-linecap="round">
          <path d="M10 10 L4 4 M10 10 L16 4 M10 10 L3 10 M10 10 L17 10 M10 10 L4 16 M10 10 L16 16"/>
        </g>
        <ellipse cx="10" cy="11.4" rx="2.5" ry="1.9" fill="var(--accent)"/>
        <circle cx="10" cy="8.4" r="1.5" fill="var(--foreground)"/>
      </svg>
      <b>Router <i>+</i> Jev</b><span>el router elige · Pi ejecuta</span>
    </div>
    <div class="live" id="live"><span class="dot"></span><span id="liveText"></span></div>
    <div class="right">
      <span class="date" id="date"></span>
      <span class="clock" id="clock">--:--:--</span>
      <span class="date">local</span>
    </div>
  </div>

  <div class="tiles" id="tiles"></div>

  <div class="row r-hero">
    <div class="panel">
      <h2>Orquestación<span class="tag" id="orchTag"></span></h2>
      <div class="stage">
        <canvas id="graph"></canvas>
        <div class="cap2" id="cap2"></div>
      </div>
    </div>
    <div class="panel">
      <h2>Consumo diario<span class="tag">30 días</span></h2>
      <div class="balance">
        <span class="big" id="balTotal"></span>
        <span class="lbl" id="balSub"></span>
      </div>
      <div class="body pad" style="padding-top:0" id="daily"></div>
    </div>
  </div>

  <div class="row r-hero">
    <div class="panel">
      <h2>Mesa de agentes<span class="tag" id="deskTag"></span></h2>
      <div class="desk" id="desk"></div>
    </div>
    <div class="panel">
      <h2>Umbrales<span class="tag" id="thrTag"></span></h2>
      <div class="body code" id="thresholds"></div>
    </div>
  </div>

  <div class="row r-hero">
    <div class="panel">
      <h2>Modelos<span class="tag" id="modelsTag"></span></h2>
      <div class="h" id="modelsHead">
        <span></span><span>modelo</span><span class="n">tokens</span>
        <span class="n">costo</span><span class="n">mes</span><span class="n">hoy</span>
      </div>
      <div class="body" id="models" style="max-height:330px"></div>
    </div>
    <div class="panel">
      <h2>Cuota<span class="tag" id="quotaTag"></span></h2>
      <div class="body" id="quota" style="max-height:330px"></div>
    </div>
  </div>

  <div class="row r-hero">
    <div class="panel">
      <h2>Decisiones<span class="tag" id="decTag"></span></h2>
      <div class="body" id="decisions" style="max-height:300px"></div>
    </div>
    <div class="panel">
      <h2>Evidencia y control<span class="tag" id="evTag"></span></h2>
      <div class="body pad" id="evidence"></div>
    </div>
  </div>

</div>

<script id="payload" type="application/json">__PAYLOAD__</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById("payload").textContent);
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = (n) => Number(n || 0).toLocaleString("es");
const pctTxt = (v) => v === null || v === undefined ? "—" : Math.round(v * 100) + "%";
const lvl = (v) => v === null || v === undefined ? "ok" : v < 0.2 ? "low" : v < 0.5 ? "mid" : "ok";

/* ---------------------------------------------------------------- reloj vivo */

function tick() {
  const now = new Date();
  $("clock").textContent = now.toLocaleTimeString("es-PE", { hour12: false });
  $("date").textContent = now.toLocaleDateString("es-PE", { day: "2-digit", month: "short", year: "numeric" }).toUpperCase();
}
tick(); setInterval(tick, 1000);

$("live").classList.toggle("on", DATA.live);
$("liveText").textContent = DATA.live ? "enrutando" : "en reposo";

/* ------------------------------------------------------------------- fichas */

const adaptiveShare = Math.round(DATA.counts.adaptive / Math.max(1, DATA.counts.adaptive + DATA.counts.static) * 100);
const tiles = [
  ["tokens", "totales", DATA.totals.tokensText, DATA.totals.calls + " llamadas"],
  ["costo", "acumulado", "$" + DATA.totals.costText, "mes $" + DATA.totals.monthCostText],
  ["hoy", "consumo", DATA.totals.todayTokensText, "$" + DATA.totals.todayCostText, true],
  ["mes", "en curso", DATA.totals.monthTokensText, "$" + DATA.totals.monthCostText],
  ["modelos", "activos", DATA.counts.active, DATA.counts.free + " gratis / " + DATA.counts.catalog + " cat"],
  ["agentes", "perfiles", DATA.agents.length, DATA.agents.filter(a => a.decisions > 0).length + " con trabajo"],
  ["decisiones", "registradas", DATA.counts.receipts, adaptiveShare + "% adaptativas", true],
  ["adaptativas", "vs estáticas", DATA.counts.adaptive, DATA.counts.static + " estáticas", true],
  ["evidencia", "admitida", DATA.counts.observations, "corridas verificadas"],
  ["cuentas", "antigravity", DATA.accounts.length || "—", "proveedores en cuota " + DATA.quotas.length],
  ["cuota", "más ajustada", DATA.quotas.length ? pctTxt(Math.min(...DATA.quotas.map(q => q.tightest ?? 1))) : "—", "ventana dura"],
  ["modo", "del router", DATA.control.mode || "—", DATA.control.exploration ? "exploración activa" : "sin exploración"],
];

/* Una chispa distinta por ficha, dibujada desde el consumo diario real, para que la
   ficha de hoy y la de ayer se distingan sin tener que leer el numero. */
function sparkline(canvas, values, color) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = canvas.clientWidth || 140, h = 22;
  canvas.width = w * dpr; canvas.height = h * dpr;
  const c = canvas.getContext("2d"); c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const recent = values.slice(-16);
  const max = Math.max(1, ...recent);
  c.beginPath();
  recent.forEach((v, i) => {
    const x = recent.length < 2 ? w / 2 : i / (recent.length - 1) * w;
    const y = h - 2 - (v / max) * (h - 5);
    i ? c.lineTo(x, y) : c.moveTo(x, y);
  });
  c.strokeStyle = color; c.lineWidth = 1.2; c.stroke();
}

$("tiles").innerHTML = tiles.map(([k, sub, value, foot, acc]) => `
  <div class="tile${acc ? " acc" : ""}">
    <div class="cap"><span class="ico"></span>${esc(k)}<em>${esc(sub)}</em></div>
    <div class="val">${esc(value)}</div>
    <canvas class="spark"></canvas>
    <div class="foot">${esc(foot)}</div>
  </div>`).join("");

const dailyTokens = DATA.daily.map(d => d.tokens);
document.querySelectorAll(".tile .spark").forEach((canvas, index) => {
  const shift = [0, 1, 2, 3, 5, 7, 0, 1, 3, 5, 7, 0][index] || 0;
  sparkline(canvas, shift ? dailyTokens.slice(0, dailyTokens.length - shift) : dailyTokens,
            getComputedStyle(document.documentElement).getPropertyValue(index % 3 === 0 ? "--accent" : index % 3 === 1 ? "--highlight" : "--warning").trim());
});

/* ------------------------------------------------------------------- balance */

$("balTotal").textContent = "$" + DATA.totals.costText;
$("balSub").textContent = DATA.totals.tokensText + " tokens · " + DATA.daily.length + " días";

const peak = Math.max(1, ...DATA.daily.map(d => d.tokens));
$("daily").innerHTML = DATA.daily.length ? `
  <svg viewBox="0 0 300 84" preserveAspectRatio="none" style="width:100%;height:80px;display:block">
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--accent)" stop-opacity=".45"/>
      <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="M0,84 ${DATA.daily.map((d, i) =>
      `L${(i / Math.max(1, DATA.daily.length - 1) * 300).toFixed(1)},${(84 - d.tokens / peak * 78).toFixed(1)}`).join(" ")} L300,84 Z" fill="url(#g)"/>
    <path d="M${DATA.daily.map((d, i) =>
      `${(i / Math.max(1, DATA.daily.length - 1) * 300).toFixed(1)},${(84 - d.tokens / peak * 78).toFixed(1)}`).join(" L")}"
      fill="none" stroke="var(--accent)" stroke-width="1.4"/>
  </svg>
  <div style="display:flex;gap:6px;font-size:9px;color:var(--muted);margin-top:4px">
    <span>${esc(DATA.daily[0].day)}</span><span style="margin-left:auto">${esc(DATA.daily[DATA.daily.length - 1].day)}</span>
  </div>` : `<div class="empty">Sin datos diarios.</div>`;

/* --------------------------------------------------------------- mesa agentes */

$("deskTag").textContent = DATA.agents.length + " puestos";
$("desk").innerHTML = DATA.agents.length === 0 ? `<div class="empty">Sin agentes.</div>`
  : DATA.agents.map((a, i) => `
    <div class="ws">
      <div class="top"><b>${esc(a.name.replace(/^gentle-ai-|^jd-|^sdd-/, ""))}</b>
        <span class="sw${a.decisions > 0 ? " on" : ""}"></span></div>
      <div class="mid">
        ${a.actuallyUsed.length ? `<span class="m">${esc(a.actuallyUsed[0].model.split("/").pop())}</span>` : ""}
        <span>${esc((a.assigned || "").split("/").pop().slice(0, 26))}</span>
      </div>
      <canvas class="wspark" data-i="${i}"></canvas>
      <div class="bot"><span>${a.decisions} dec</span><i>${a.adaptive} adapt</i></div>
    </div>`).join("");

document.querySelectorAll(".wspark").forEach((canvas) => {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = canvas.clientWidth || 130, h = 20;
  canvas.width = w * dpr; canvas.height = h * dpr;
  const c = canvas.getContext("2d"); c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const values = dailyTokens.slice(-12);
  const max = Math.max(1, ...values);
  c.beginPath();
  values.forEach((v, i) => {
    const x = values.length < 2 ? w / 2 : i / (values.length - 1) * w;
    const y = h - 1.5 - (v / max) * (h - 4);
    i ? c.lineTo(x, y) : c.moveTo(x, y);
  });
  c.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue("--line").trim() || "#555";
  c.strokeStyle = "color-mix(in srgb, var(--accent) 45%, transparent)";
  c.lineWidth = 1; c.stroke();
});

/* -------------------------------------------------------------------- modelos */

$("modelsTag").textContent = DATA.models.length + " con consumo";
$("models").innerHTML = DATA.models.length === 0 ? `<div class="empty">Sin consumo registrado.</div>`
  : DATA.models.map(m => `
    <div class="l">
      <span class="sw${m.live ? " on" : ""}"></span>
      <span class="nm">${esc(m.name)}<em> · ${esc(m.provider)}</em></span>
      <span class="n hi">${esc(m.tokensText)}</span>
      <span class="n${m.cost === 0 ? "" : " acc"}">$${esc(m.costText)}</span>
      <span class="n">${m.monthTokens ? (m.monthTokens / 1e6).toFixed(0) + "M" : "—"}</span>
      <span class="n">${m.todayTokens ? (m.todayTokens / 1e6).toFixed(1) + "M" : "—"}</span>
    </div>`).join("");

/* ------------------------------------------------------- umbrales (los reales) */

/* Los numeros del router, mostrados como el archivo que son: la tabla de requisitos
   por clase de tarea y los pisos de evidencia. No son decorativos — son los que el
   router aplica en cada decision. */
const thresholdLines = [
  ["cm", "# umbrales con los que el router decide"],
  ["", ""],
  ["kw", "EVIDENCIA", "  el piso que un modelo tiene que alcanzar"],
  ["nm", "supportedResolvedN", "vl", "8"],
  ["nm", "supportedFingerprints", "vl", "5"],
  ["nm", "establishedResolvedN", "vl", "24"],
  ["nm", "establishedFingerprints", "vl", "12"],
  ["nm", "establishedLanguages", "vl", "2"],
  ["", ""],
  ["kw", "EXPLORACION"],
  ["nm", "tasa_normal", "vl", "7 %"],
  ["nm", "tasa_arranque_en_frio", "vl", "100 %"],
  ["cm", "# sin default confiable, el limite no protege nada"],
  ["", ""],
  ["kw", "COSTO", "  orden entre candidatos"],
  ["nm", "costPerSuccess", "cm", "primero — ya cobra la falta de fiabilidad"],
  ["nm", "wilson_inferior", "cm", "desempata la confianza"],
  ["nm", "tokensPerSuccess", "cm", "después"],
  ["", ""],
  ["kw", "CLASES", "  riesgo por carta"],
  ["nm", "bajo_riesgo", "vl", DATA.counts.active + " modelos elegibles"],
  ["nm", "riesgo_alto", "cm", "estáticas hasta que un modelo se gradúe"],
];
$("thrTag").textContent = thresholdLines.filter(l => l[0] === "nm").length + " constantes";
$("thresholds").innerHTML = thresholdLines.map((parts, i) => {
  if (parts[1] === "" && parts[0] === "") return `<div class="ln"><span class="no">${i + 1}</span><span class="tx">&nbsp;</span></div>`;
  const [kind, name, extra, value] = parts;
  let html = `<span class="no">${i + 1}</span><span class="tx">`;
  if (kind === "cm") html += `<span class="cm">${esc(name)}</span>`;
  else if (kind === "kw") html += `<span class="kw">${esc(name)}</span>${extra ? ` <span class="cm">${esc(extra)}</span>` : ""}`;
  else html += `<span class="nm2">${esc(name)}</span> = <span class="vl">${esc(extra)}</span>${value ? ` <span class="cm"># ${esc(value)}</span>` : ""}`;
  return html + `</span></div>`;
}).join("");

/* ---------------------------------------------------------------------- cuota */

$("quotaTag").textContent = DATA.quotas.length + " proveedores";
$("quota").innerHTML = DATA.quotas.length === 0 ? `<div class="empty">Sin datos de cuota.</div>`
  : DATA.quotas.map(q => {
    const hard = q.windows.filter(w => w.hard).slice(0, 4);
    return `<div class="prov">
      <div class="hd"><b>${esc(q.alias)}</b>
        <em>${esc(q.health || "")}${q.tightest !== null && q.tightest !== undefined ? " · margen " + pctTxt(q.tightest) : ""}</em></div>
      ${hard.length ? hard.map(w => `
        <div class="w">
          <div class="t"><span>${esc((w.label || w.id || "").replace(/ Remaining$/, "").slice(0, 38))}</span>
            <span>${pctTxt(w.remaining)}${w.resetAt ? " · " + esc(w.resetAt.slice(5, 16).replace("T", " ")) : ""}</span></div>
          <div class="tr"><i class="${lvl(w.remaining)}" style="width:${Math.max(1.5, (w.remaining ?? 0) * 100)}%"></i></div>
        </div>`).join("") : `<div class="w"><div class="t"><span>sin ventanas declaradas</span></div></div>`}
    </div>`;
  }).join("");

/* ---------------------------------------------------------------- decisiones */

const chip = (d) => d.kind === "ADAPTIVE_ASSIGNMENT" ? "a" : (d.risk === "HIGH" || d.risk === "CRITICAL") ? "hi" : "";
$("decTag").textContent = DATA.decisions.length + " últimas";
$("decisions").innerHTML = DATA.decisions.length === 0 ? `<div class="empty">Sin decisiones.</div>`
  : DATA.decisions.map(d => `
    <div class="l d">
      <span class="n">${esc(d.ago)}</span>
      <span class="nm"><span class="pill ${chip(d)}">${d.kind === "ADAPTIVE_ASSIGNMENT" ? "adapt" : "estát"}</span>
        ${esc(d.role || "")}<em> · ${esc(d.taskClass || "")}</em>
        ${d.model ? `<br><span class="u">${esc(d.model)}</span>` : `<br><em>${esc(d.reason)}</em>`}</span>
      <span class="n">${d.latency ? Math.round(d.latency) + "ms" : ""}</span>
    </div>`).join("");

/* ------------------------------------------------------------ evidencia/control */

$("evTag").textContent = DATA.counts.observations + " evidencias";
$("evidence").innerHTML = [
  ["Modo", DATA.control.mode || "—"],
  ["Cortacircuitos", DATA.control.breaker || "—"],
  ["Exploración", DATA.control.exploration ? "activa" : "inactiva"],
  ["Canario limpio", DATA.control.canary || "—"],
  ["Evidencia admitida", DATA.counts.observations],
  ["Modelos en catálogo", DATA.counts.catalog],
  ["Cuentas antigravity", DATA.accounts.length || "—"],
  ["Acento", DATA.accent],
  ["Generado", DATA.generatedAt],
].map(([k, v]) => `<div class="kv"><span>${esc(k)}</span><span>${esc(v)}</span></div>`).join("");

/* ======================================================= la telaraña y la araña ===

   La red es el catalogo: cada nodo es un modelo, y se enciende con su consumo. La araña
   la recorre tocando nodos, que es exactamente lo que hace el router: elegir uno entre
   muchos y empujar el trabajo hacia el. Un solo canvas y un solo bucle. */

const canvas = $("graph"), ctx = canvas.getContext("2d");
const still = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let nodes = [], W = 0, H = 0, route = [], routeIndex = 0, spider = { x: .5, y: .5 }, gait = 0;

const accentColor = () => getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#7aa2f7";
const fgColor = () => getComputedStyle(document.documentElement).getPropertyValue("--foreground").trim() || "#fff";
const mutedColor = () => getComputedStyle(document.documentElement).getPropertyValue("--muted").trim() || "#888";

function resize() {
  const box = canvas.parentElement.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = box.width; H = box.height;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  place();
}

/* Los nodos se siembran una vez por tamano, con la posicion derivada del nombre, para
   que el dibujo no cambie de forma en cada recarga. */
function place() {
  const list = DATA.models.length ? DATA.models.slice(0, 46)
    : Array.from({ length: 26 }, (_, i) => ({ name: "m" + i, tokens: 0 }));
  nodes = list.map((model, index) => {
    let hash = 0;
    for (const ch of model.name) hash = (hash * 31 + ch.charCodeAt(0)) & 0xffff;
    const angle = (index / list.length) * Math.PI * 2 + (hash % 100) / 100 * .6;
    const radius = .20 + ((hash % 53) / 53) * .30;
    return {
      x: .5 + Math.cos(angle) * radius * 1.85,
      y: .5 + Math.sin(angle) * radius * .95,
      weight: model.tokens > 0 ? Math.min(1, model.tokens / (peak || 1) / 3 + .28) : .13,
      live: !!model.live, phase: (hash % 628) / 100, touched: 0,
    };
  });
}

/* La araña no recorre la lista en orden: va al nodo mas cercano que le queda. Eso da un
   paso continuo en vez de saltos de un extremo al otro. */
function routePlan() {
  if (!nodes.length) { route = []; return; }
  route = []; const left = new Set(nodes.map((_, i) => i)); let at = 0;
  while (left.size && route.length < 20) {
    route.push(at); left.delete(at);
    let best = null, bestD = Infinity;
    for (const i of left) {
      const d = (nodes[i].x - nodes[at].x) ** 2 + (nodes[i].y - nodes[at].y) ** 2;
      if (d < bestD) { bestD = d; best = i; }
    }
    if (best === null) break; at = best;
  }
  routeIndex = 0;
}

function drawSpider(x, y, scale, heading, t, color, ink) {
  const L = 24 * scale;
  ctx.save(); ctx.translate(x, y); ctx.rotate(heading);
  for (let side = -1; side <= 1; side += 2) {
    for (let i = 0; i < 4; i++) {
      const off = i * .42, phase = (side > 0 ? 0 : Math.PI) + off + gait;
      const swing = Math.sin(t * 3.4 + phase) * (-.85 + i * .42) * .5;
      const len = L * (1 - Math.abs(i - 1.5) * .09);
      const mx = Math.cos(swing) * len * .58, my = Math.sin(swing) * len * .58 - len * .3;
      const ex = Math.cos(swing * 1.5) * len, ey = Math.sin(swing * 1.5) * len - len * .12;
      ctx.beginPath(); ctx.moveTo(0, 0);
      ctx.lineTo(mx, side * Math.abs(my) - 2 * side);
      ctx.lineTo(ex, side * Math.abs(ey));
      ctx.strokeStyle = ink; ctx.lineWidth = 1.4 * scale; ctx.lineCap = "round"; ctx.stroke();
    }
  }
  const beat = .5 + Math.sin(t * 2.6) * .5;
  ctx.beginPath(); ctx.ellipse(-7 * scale, 0, 9 * scale, 6.4 * scale, 0, 0, Math.PI * 2);
  ctx.fillStyle = color; ctx.globalAlpha = .92; ctx.fill(); ctx.globalAlpha = 1;
  ctx.beginPath(); ctx.ellipse(3.5 * scale, 0, 5.2 * scale, 4.4 * scale, 0, 0, Math.PI * 2);
  ctx.fillStyle = ink; ctx.fill();
  ctx.beginPath(); ctx.arc(-7 * scale, 0, 12 * scale * (.55 + beat * .16), 0, Math.PI * 2);
  ctx.strokeStyle = color; ctx.globalAlpha = .16 + beat * .1; ctx.lineWidth = 1; ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.restore();
}

function frame(ms) {
  const t = ms / 1000, color = accentColor(), ink = fgColor(), muted = mutedColor();
  ctx.clearRect(0, 0, W, H);
  const P = (n) => ({ x: n.x * W, y: n.y * H });

  ctx.lineWidth = 1;
  for (const a of nodes) for (const b of nodes) {
    if (a === b) continue;
    const p = P(a), q = P(b), d = Math.hypot(p.x - q.x, p.y - q.y);
    if (d > 128) continue;
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y);
    ctx.strokeStyle = color; ctx.globalAlpha = (1 - d / 128) * .11 * (.4 + a.weight); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  /* Las hebras del recorrido: lo que la araña ya tejió. Se dibujan como cordel para que
     el panel muestre el trabajo del router como una tela y no como puntos sueltos. */
  if (route.length > 1) {
    ctx.beginPath();
    route.forEach((i, k) => { const p = P(nodes[i]); k ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y); });
    ctx.strokeStyle = color; ctx.globalAlpha = .2; ctx.setLineDash([5, 7]); ctx.stroke();
    ctx.setLineDash([]); ctx.globalAlpha = 1;
  }

  for (const node of nodes) {
    const p = P(node), beat = .5 + Math.sin(t * 1.5 + node.phase) * .5;
    const r = 1.6 + node.weight * 3.6 + beat * node.weight * 1.2;
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    ctx.fillStyle = node.weight > .3 ? color : muted;
    ctx.globalAlpha = .32 + node.weight * .62; ctx.fill();
    if (node.touched > 0) {
      ctx.beginPath(); ctx.arc(p.x, p.y, r + 5 * node.touched, 0, Math.PI * 2);
      ctx.strokeStyle = color; ctx.globalAlpha = node.touched * .5; ctx.stroke();
      node.touched = Math.max(0, node.touched - .02);
    }
    if (node.live) {
      ctx.beginPath(); ctx.arc(p.x, p.y, r + 6 + beat * 3, 0, Math.PI * 2);
      ctx.strokeStyle = color; ctx.globalAlpha = .55; ctx.lineWidth = 1.4; ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  if (route.length > 1) {
    const to = P(nodes[(routeIndex + 1) % route.length]);
    const speed = still ? 0 : .013;
    spider.x += (to.x - spider.x) * speed; spider.y += (to.y - spider.y) * speed;
    if (Math.hypot(to.x - spider.x, to.y - spider.y) < 6) {
      routeIndex = (routeIndex + 1) % route.length; nodes[route[routeIndex]].touched = 1;
    }
    gait += still ? 0 : .05;
    drawSpider(spider.x, spider.y, Math.max(.85, Math.min(W, H) / 320),
               Math.atan2(to.y - spider.y, to.x - spider.x), t, color, ink);
  }
  requestAnimationFrame(frame);
}

resize(); routePlan();
if (nodes.length) spider = { x: nodes[route[0]].x * W, y: nodes[route[0]].y * H };
$("orchTag").textContent = nodes.length + " nodos";
$("cap2").innerHTML = nodes.length
  ? `la araña recorre <b>${nodes.length}</b> modelos · cada nodo se enciende con su consumo`
  : `sin modelos registrados todavía`;
window.addEventListener("resize", () => { resize(); routePlan(); });
requestAnimationFrame(frame);

/* La página se recarga sola para seguir al generador, que reescribe este archivo cada
   30 s. No necesita servidor ni conexión. */
if (!still) setTimeout(() => window.location.reload(), 30000);
</script>
</body>
</html>
