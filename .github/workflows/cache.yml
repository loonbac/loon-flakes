name: cache

# Publica en la caché binaria los paquetes propios que la máquina compilaba
# desde fuente. Se construye con el lock de ESTE flake para que el store path
# coincida exactamente con el que evalúa el sistema: si se construyera con otro
# nixpkgs (por ejemplo el del CI de port), la caché no serviría de nada.
on:
  push:
    branches: [master]
  # Disparador primario: calienta la caché aunque nadie toque este repo.
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cache-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: cachix/install-nix-action@d9186cbdca7adedf113a159fa91f725a27866771 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@ad2ddac53f961de1989924296a1f236fcfbaa4fc # v15
        with:
          name: loon-flakes
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # Paquetes propios cuyo build cuesta minutos de CPU (Rust y GTK).
      # Se construye el lock COMMITEADO, nunca uno actualizado aquí: así lo que
      # se publica es exactamente la revisión que el sistema evalúa. Mover el
      # lock dentro del runner publicaría un artefacto que esta máquina no usa.
      - name: Construir y publicar
        run: |
          set -euo pipefail
          nix build --print-out-paths .#port .#nixos-updates .#loon-launch > /tmp/paths
          xargs -r cachix push loon-flakes < /tmp/paths
