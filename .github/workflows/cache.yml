name: cache

# Publica en la caché binaria los paquetes propios que la máquina compilaba
# desde fuente. Se construye con el lock de ESTE flake para que el store path
# coincida exactamente con el que evalúa el sistema: si se construyera con otro
# nixpkgs (por ejemplo el del CI de port), la caché no serviría de nada.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cache-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v15
        with:
          name: loon-flakes
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # Paquetes propios cuyo build cuesta minutos de CPU (Rust y GTK).
      - name: Construir y publicar
        run: |
          nix build --print-out-paths .#port .#nixos-updates .#loon-launch | tee /tmp/paths
          xargs -r cachix push loon-flakes < /tmp/paths
